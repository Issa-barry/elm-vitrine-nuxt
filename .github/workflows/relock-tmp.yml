name: relock-tmp

# Workflow temporaire : régénère package-lock.json sur ubuntu-latest (même
# runner que ci.yml) pour garantir la reproductibilité exacte avec npm ci.
# Supprimé juste après usage.
on:
  push:
    branches:
      - chore/security-nuxt-upgrade
    paths:
      - '.github/workflows/relock-tmp.yml'

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm -v
      - run: rm -f package-lock.json
      - run: npm install

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
