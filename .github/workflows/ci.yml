name: ci

# Contrôle qualité bloquant sur toute PR touchant une branche du flux de
# promotion (dev -> pre-prod -> production -> main). Le déploiement reste
# géré nativement par Hostinger (intégration Git côté panneau) : ce workflow
# ne fait que garder la CI/CD honnête — voir AGENTS.md.
on:
  pull_request:
    branches:
      - dev
      - pre-prod
      - production
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` (installation stricte, lock/package.json parfaitement synchronisés)
      # échoue actuellement : package-lock.json contient une incohérence
      # préexistante sur une dépendance optionnelle transitive
      # (@emnapi/core, via unrs-resolver <- eslint-plugin-import-x <-
      # @nuxt/eslint-config) que la régénération complète du lock ferait
      # sauter en cascade tout l'arbre (nuxt 3.9 -> 3.21, @nuxt/schema 4.x,
      # vite 5 -> 7...) sans validation possible dans le cadre de cette
      # tâche CI/CD. `npm install` reste fiable en attendant une
      # resynchronisation ciblée du lock file (voir AGENTS.md /
      # historique git de ce fichier).
      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (nuxt typecheck)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (nuxt build)
        run: npm run build
