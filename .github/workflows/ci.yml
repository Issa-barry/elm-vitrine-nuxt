name: ci

# Contrôle qualité bloquant sur toute PR touchant une branche du flux de
# promotion (dev -> pre-prod -> production -> main). Le déploiement reste
# géré nativement par Hostinger (intégration Git côté panneau) : ce workflow
# ne fait que garder la CI/CD honnête — voir AGENTS.md.
on:
  pull_request:
    branches:
      - dev
      - pre-prod
      - production
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (nuxt typecheck)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (nuxt build)
        run: npm run build
